name: Generate shoe pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-shoe-pages.js'
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily — picks up new shoes added to Google Sheets
  workflow_dispatch:        # run manually from GitHub Actions tab any time

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate shoe pages
        run: node scripts/generate-shoe-pages.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shoe-data.json shoes/ sitemap.xml
          git diff --staged --quiet && echo "Nothing changed — skipping commit." && exit 0
          git commit -m "Regenerate shoe pages [skip ci]"
          git push
