<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 140">
  <!-- Arch — starts and ends well inside the viewBox so stroke never clips -->
  <path d="M25 72 Q150 12 275 72" stroke="#d44235" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- COTSWOLD bold -->
  <text
    x="150" y="110"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="46"
    fill="#d44235"
    text-anchor="middle"
    letter-spacing="1"
  >COTSWOLD</text>
  <!-- outdoor -->
  <text
    x="150" y="133"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="400"
    font-size="22"
    fill="#d44235"
    text-anchor="middle"
    letter-spacing="4"
  >outdoor</text>
</svg>
